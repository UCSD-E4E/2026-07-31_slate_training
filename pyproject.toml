[project]
name = "slate-training"
version = "0.1.0"
description = "Model-assisted dive-slate labeling for FishSense laser calibration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Canonical home for the board-plane primitive and the classical estimator
    # (fishsense_core.plane, fishsense_core.slate) — moved out of this repo so
    # there is one definition. Sourced from the local checkout below; drop the
    # [tool.uv.sources] override to use the released wheel. 2.4.1 is the first
    # release that carries these AND has published wheels (2.4.0 shipped none).
    "fishsense-core>=2.4.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Pulling the real dataset needs the API SDK + object store + PDF render.
extract = [
    "fishsense-api-sdk",
    "boto3>=1.34",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "rawpy>=0.27.0",
]
# The board mask now lives in fishsense-core (fishsense_core.slate.BoardMasker);
# its optional deps (torch, huggingface-hub) and headless OpenCV come through
# that extra rather than being redeclared here. Deliberately separate from
# `train`: no torchvision.
mask = [
    "fishsense-core[slate]>=2.4.1",
]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live API credentials or NAS/S3 access",
]

[tool.uv.sources]
fishsense-api-sdk = { path = "../fishsense-lite/libs/fishsense-api-sdk", editable = true }
fishsense-core = { path = "../fishsense-core/python/fishsense_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_training"]
