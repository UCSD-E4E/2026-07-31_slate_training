[project]
name = "slate-training"
version = "0.1.0"
description = "Model-assisted dive-slate labeling for FishSense laser calibration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Pulling the real dataset needs the API SDK + object store + PDF render.
extract = [
    "fishsense-api-sdk",
    "boto3>=1.34",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "rawpy>=0.27.0",
]
# Inference only -- what fishsense-core[slate] needs to use the checkpoint.
# Deliberately separate from `train`: consumers should not pull torchvision.
mask = [
    "torch>=2.4",
    "opencv-python-headless>=4.9",
]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live API credentials or NAS/S3 access",
]

[tool.uv.sources]
fishsense-api-sdk = { path = "../fishsense-lite/libs/fishsense-api-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_training"]
